[package]
name = "rustjay-prodjlink"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
description = "Rust client for Pioneer/AlphaTheta Pro DJ Link status and metadata monitoring (rustjay fork of prodjlink-rs)"
license = "MIT"
repository = "https://github.com/BlueJayLouche/prodjlink-rs"
homepage = "https://github.com/Compellerai/prodjlink-rs"
readme = "README.md"
keywords = ["prodjlink", "pioneer", "cdj", "dj", "rekordbox"]
categories = ["network-programming", "multimedia"]

[dependencies]
log = "0.4"
parking_lot = "0.12"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
serde = { version = "1.0", features = ["derive"], optional = true }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
serde = ["dep:serde"]
fuzz = []

[dev-dependencies]
env_logger = "0.11"

[lib]
name = "prodjlink_rs"
